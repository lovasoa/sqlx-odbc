[package]
name = "sqlx-repro"
version = "0.0.0"
edition = "2024"
publish = false
description = "The sqlx-odbc side of a reproduction. `repro/sqlx-oldapi` exports the same names for sqlx-oldapi."

[dependencies]
sqlx-core = { version = "=0.9.0", default-features = false, features = ["any"] }
sqlx-odbc = { path = "../..", features = ["runtime-tokio", "chrono", "bigdecimal", "json", "uuid"] }
