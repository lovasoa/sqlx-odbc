[package]
name = "sqlx-odbc"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/launchbadge/sqlx"
description = "ODBC driver implementation for SQLx."
rust-version = "1.82"

[features]
default = []
runtime-tokio = []
tls-none = []

[dependencies]
futures-core = { version = "0.3.32", default-features = false }
futures-util = { version = "0.3.32", default-features = false, features = ["alloc"] }
log = "0.4.28"
odbc-api = "28"
sqlx-core = { version = "=0.9.0", default-features = false, features = ["any"] }
thiserror = "2.0.17"
url = "2.5.7"

[dev-dependencies]
tokio = { version = "1.25.0", features = ["macros", "rt"] }
