name: ODBC

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - v*

defaults:
  run:
    shell: bash

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31

      - uses: Swatinem/rust-cache@v2

      - name: Check the flake
        run: nix flake check

      - name: Check Nix formatting
        run: nix fmt -- --ci

      - name: Run static checks
        run: nix develop --command scripts/ci.sh

  odbc-drivers:
    name: ODBC driver / ${{ matrix.driver }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - driver: duckdb
            command: scripts/test-driver.sh duckdb
          - driver: postgres
            command: with-postgres scripts/test-driver.sh postgres

    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31

      - uses: Swatinem/rust-cache@v2
        with:
          key: odbc-${{ matrix.driver }}

      - name: Run ODBC integration tests
        run: nix develop --command ${{ matrix.command }}

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs:
      - static
      - odbc-drivers
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31

      - uses: Swatinem/rust-cache@v2

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: nix develop --command scripts/publish.sh
