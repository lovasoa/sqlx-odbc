name: ODBC

on:
  pull_request:
  push:
    branches:
      - main

defaults:
  run:
    shell: bash

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install ODBC headers
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev

      - name: Test
        run: cargo test --all-features

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rustdoc
        run: cargo rustdoc --all-features -- -D missing_docs -D rustdoc::broken_intra_doc_links

  odbc-drivers:
    name: ODBC driver / ${{ matrix.driver }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        driver:
          - duckdb
          - sqlite

    env:
      DUCKDB_ODBC_VERSION: v1.5.2

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install ODBC runtime
        run: sudo apt-get update && sudo apt-get install -y curl libsqliteodbc odbcinst unixodbc unzip

      - name: Install DuckDB ODBC driver
        if: matrix.driver == 'duckdb'
        run: |
          curl -L \
            --fail \
            --output "$RUNNER_TEMP/duckdb_odbc.zip" \
            "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_ODBC_VERSION}/duckdb_odbc-linux-amd64.zip"
          unzip -q "$RUNNER_TEMP/duckdb_odbc.zip" -d "$RUNNER_TEMP/duckdb_odbc"
          duckdb_driver="$(find "$RUNNER_TEMP/duckdb_odbc" -type f -name libduckdb_odbc.so -print -quit)"
          test -n "$duckdb_driver"
          echo "DUCKDB_ODBC_DRIVER=$duckdb_driver" >> "$GITHUB_ENV"

      - name: Run ODBC integration tests
        run: scripts/test-driver.sh "${{ matrix.driver }}"
