name: ODBC Driver Matrix

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: ${{ matrix.driver }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        driver:
          - duckdb
          - sqlite

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install unixODBC
        run: |
          sudo apt-get update
          sudo apt-get install -y curl odbcinst unixodbc unzip

      - name: Install SQLite ODBC driver
        if: matrix.driver == 'sqlite'
        run: sudo apt-get install -y libsqliteodbc

      - name: Install DuckDB ODBC driver
        if: matrix.driver == 'duckdb'
        run: |
          curl -fsSL \
            -o "$RUNNER_TEMP/duckdb_odbc.zip" \
            "https://github.com/duckdb/duckdb/releases/latest/download/duckdb_odbc-linux-amd64.zip"
          unzip -q "$RUNNER_TEMP/duckdb_odbc.zip" -d "$RUNNER_TEMP/duckdb_odbc"
          echo "DUCKDB_ODBC_DRIVER=$RUNNER_TEMP/duckdb_odbc/libduckdb_odbc.so" >> "$GITHUB_ENV"

      - name: Run fast tests
        run: cargo test --lib

      - name: Run ODBC integration tests
        run: scripts/test-driver.sh "${{ matrix.driver }}"
